<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Nadiminti's Classic Food</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>Order dashboard</h1><p>Nadiminti's Classic Food</p></div><a href="/">Customer website</a></header><main><section class="card"><label>Admin key<input id="key" type="password" placeholder="Enter the key from your .env file"></label><button id="load">Load orders</button><p id="notice"></p></section><section id="orders"></section></main><script>const $=id=>document.getElementById(id),m=n=>'₹'+n;async function load(){const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':$('key').value}}),d=await r.json();if(!r.ok){$('notice').textContent=d.error;return}$('notice').textContent=`${d.length} order(s)`;$('orders').innerHTML=d.map(o=>`<article class="card"><h3>${o.id} · ${o.status}</h3><p><b>${o.customerName}</b> · ${o.phone}<br>${o.orderType} · ${o.address}<br>${o.distanceKm===null?'Takeaway':o.distanceKm+' km'} · Delivery ${m(o.deliveryFee)} · Total ${m(o.total)}</p><p>${o.items.map(i=>i.name+' × '+i.quantity).join(', ')}</p><select id="s-${o.id}">${['New','Accepted','Preparing','Ready','Completed','Rejected'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select><button onclick="update('${o.id}')">Update status</button></article>`).join('')||'<p>No orders yet.</p>'}async function update(id){const r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':$('key').value},body:JSON.stringify({status:$('s-'+id).value})});if(!r.ok){$('notice').textContent=(await r.json()).error;return}load()}$('load').onclick=load;</script></body></html>
